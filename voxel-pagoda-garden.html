<style>

  </svg>
  <div class="lt">Sakura Pagoda Garden</div>
  <div class="bar"><i id="lbar"></i></div>
  <div id="lmsg">Unfolding the garden…</div>

  // Surface load failures (offline, blocked CDN, no WebGL) instead of a silent spinner.
  const showErr = (msg) => { const el = document.getElementById('err'); if (el && !window.__sceneReady) { el.style.display = 'block'; el.textContent = msg; } };
  window.addEventListener('error', (e) => showErr('Something went wrong while building the garden: ' + (e.message || e)));
  setTimeout(() => { if (!window.__sceneStarted) showErr('The 3D engine (three.js) could not be loaded. This page fetches it from cdn.jsdelivr.net, so it needs an internet connection.'); }, 15000);
</script>

/* =====================================================================

function genTerrain() {

/* =====================================================================

/* =====================================================================

/* ---------- five-storey pagoda ---------- */

    if (d === b) {

const koi = [];
const koiMat = new THREE.MeshLambertMaterial({ vertexColors: true, emissive: 0xffffff, emissiveIntensity: 0.12 });
function makeKoi(n) {

  const patterns = [
    (x, y, z) => (y === 1 && hash3(x, z, 3) < 0.55 ? M.verm : M.fox),
    (x, y, z) => (hash3(x, y, z) < 0.18 ? M.black : y === 1 && hash3(x, z, 5) < 0.45 ? M.verm : M.fox),
    () => M.gold,
    (x, y, z) => (y === 1 && hash3(x, z, 8) < 0.3 ? M.fox : M.maple[1]),
    (x, y, z) => (hash3(x, y, z) < 0.45 ? M.black : hash3(x, z, 2) < 0.5 ? M.verm : M.fox),
  ];
  const inWater = (x, z) => get(Math.floor(x), WL, Math.floor(z)) === M.water && get(Math.floor(x), WL - 1, Math.floor(z)) === M.water;
  for (let i = 0; i < n; i++) {
    const pat = patterns[i % patterns.length];
    const body = voxelModel(3, 2, 7, (put) => {
      for (let z = 0; z < 7; z++) for (let x = 0; x < 3; x++) for (let y = 0; y < 2; y++) {
        if ((z === 0 || z === 6) && x !== 1) continue;
        if (z === 1 && x !== 1 && y === 1) continue;
        put(x, y, z, pat(x, y, z + i * 7));
      }
    });
    body.translate(-1.5, -1, -3.5);
    const tail = voxelModel(3, 1, 2, (put) => { put(1, 0, 1, pat(1, 0, 90 + i)); put(0, 0, 0, pat(0, 0, 91 + i)); put(2, 0, 0, pat(2, 0, 92 + i)); put(1, 0, 0, pat(1, 0, 93 + i)); });
    tail.translate(-1.5, -0.5, -2);
    const g = new THREE.Group(), tm = new THREE.Mesh(tail, koiMat);
    tm.position.z = -3.4;
    g.add(new THREE.Mesh(body, koiMat), tm);
    g.scale.setScalar(0.34);
    let path = null;
    for (let c = 0; c < 600 && !path; c++) {
      const cand = { ox: rand(-6, 6), oz: rand(-5, 5), rx: rand(3.5, 12), rz: rand(3, 9), rot: rand(0, 6.28) };
      let ok = true;
      for (let s = 0; s < 72 && ok; s++) {

        const px = pcx + cand.ox + lx * Math.cos(cand.rot) - lz * Math.sin(cand.rot), pz = pcz + cand.oz + lx * Math.sin(cand.rot) + lz * Math.cos(cand.rot);
        if (!inWater(px, pz) || !inWater(px + 1.2, pz) || !inWater(px - 1.2, pz) || !inWater(px, pz + 1.2) || !inWater(px, pz - 1.2)) ok = false;
      }
      if (ok) path = cand;
    }
    if (!path) continue;
    world.add(g);
    koi.push({ g, tm, ...path, dir: rng() < 0.5 ? 1 : -1, sp: rand(0.1, 0.2) * (12 / (path.rx + path.rz)), ph: rand(0, 6.28), cx: pcx, cz: pcz, y: WL + 0.5 - rng() * 0.12 });

}
function updateKoi(t) {
  for (const K of koi) {
    const a = K.ph + t * K.sp * K.dir, a2 = a + 0.02 * K.dir, c = Math.cos(K.rot), s = Math.sin(K.rot);
    const lx = Math.cos(a) * K.rx, lz = Math.sin(a) * K.rz, lx2 = Math.cos(a2) * K.rx, lz2 = Math.sin(a2) * K.rz;
    const x = K.cx + K.ox + lx * c - lz * s, z = K.cz + K.oz + lx * s + lz * c;
    const x2 = K.cx + K.ox + lx2 * c - lz2 * s, z2 = K.cz + K.oz + lx2 * s + lz2 * c;
    K.g.position.set(x, K.y, z);

const NBF = 26;
const bfWing = new THREE.PlaneGeometry(0.7, 0.55).rotateX(-Math.PI / 2);

  for (let i = 0; i < NBF; i++) {

    do { const a = rng() * 6.283, r = Math.sqrt(rng()) * 60; x = CX + Math.cos(a) * r; z = CZ + Math.sin(a) * r; }

function makeLilies(list) {
  const pad = voxelModel(5, 1, 5, (put) => { for (let x = 0; x < 5; x++) for (let z = 0; z < 5; z++) { if ((x === 0 || x === 4) && (z === 0 || z === 4)) continue; if (x === 2 && z >= 3) continue; put(x, 0, z, (x + z) % 3 ? M.leafMid[2] : M.leafMid[0]); } });

  const flowers = list.filter((l) => l.flower);
  const lot = new THREE.InstancedMesh(lotus, propMat, Math.max(1, flowers.length));
  let fi = 0;
  list.forEach((l, i) => {
    dummy.position.set(l.x, WL + 0.87, l.z); dummy.rotation.set(0, l.rot, 0); dummy.scale.set(0.42 * l.s, 0.1, 0.42 * l.s); dummy.updateMatrix();

   ===================================================================== */
let fireflies = null, smoke = null;
const loaderMsg = (m, p) => { $('lmsg').textContent = m; $('lbar').style.width = `${Math.round(p * 100)}%`; };
async function build() {
  let info = null;
  const steps = [
    ['Shaping the floating island…', () => genTerrain()],
    ['Filling the koi pond and streams…', () => { genWater(); genPaths(); }],
    ['Raising the five-storey pagoda…', () => { info = placeStructures(); }],
    ['Planting cherry blossoms…', () => placePlants()],
    ['Tending moss, flowers and roots…', () => { groundDetails(); undersideDetails(); }],
  ];
  for (let s = 0; s < steps.length; s++) { loaderMsg(steps[s][0], s * 0.08); await nextFrame(); steps[s][1](); }
  loaderMsg('Counting blossoms…', 0.42); await nextFrame();
  let count = 0;
  const sakuraSet = new Uint8Array(MAXM);
  for (const m of [...M.sakura, ...M.sakuraWhite, ...M.sakuraDeep]) sakuraSet[m] = 1;
  for (let y = 1; y < SY; y++) for (let z = 0; z < SZ; z++) {
    let i = (y * SZ + z) * SX;
    for (let x = 0; x < SX; x++, i++) {
      const m = W[i]; if (!m) continue; count++;
      if (sakuraSet[m] && !W[i - SX * SZ] && hash3(x, y, z) < 0.35) PETAL_SPAWNS.push([x, y, z]);
    }
  }
  $('voxcount').textContent = count.toLocaleString('en-US');
  buildLightGrid();
  const CH = 40, chunks = [];
  for (let z0 = 0; z0 < SZ; z0 += CH) for (let x0 = 0; x0 < SX; x0 += CH) chunks.push([x0, z0]);
  const G = { sx: SX, sy: SY, sz: SZ, data: W };
  let faces = 0;
  for (let c = 0; c < chunks.length; c++) {
    const [x0, z0] = chunks[c];
    if (c % 3 === 0) { loaderMsg(`Carving voxels into light… ${Math.round((c / chunks.length) * 100)}%`, 0.45 + 0.45 * (c / chunks.length)); await nextFrame(); }
    const r = meshGrid(G, x0, Math.min(SX, x0 + CH), z0, Math.min(SZ, z0 + CH), true);
    faces += r.faces;
    if (r.solid) { const m = new THREE.Mesh(r.solid, voxMat); m.castShadow = m.receiveShadow = true; world.add(m); }
    if (r.water) { const m = new THREE.Mesh(r.water, watMat); m.receiveShadow = true; m.renderOrder = 2; world.add(m); }
  }
  loaderMsg('Releasing koi, doves and fireflies…', 0.93); await nextFrame();
  makeClouds();
  for (let i = 0; i < NP; i++) spawnPetal(i, true);
  world.add(petals);
  fireflies = makeFireflies(300); world.add(fireflies);
  smoke = makeSmoke(...info.incense); world.add(smoke);
  makeBirds(7); makeKoi(11); makeButterflies(); world.add(bfR, bfL);
  makeLilies(pondPlants());
  window.garden.stats = { voxels: count, faces, lights: LIGHTS.length, petalSpawns: PETAL_SPAWNS.length, koi: koi.length, birds: birds.length };
}

const clock = new THREE.Clock();
let elapsed = 0, lastTod = -1, perfFrames = 0, perfTime = 0, perfDone = false;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt; U.time.value = elapsed;
  if (state.lapse) state.tod = (state.tod + dt * 0.33) % 24;
  else if (state.target !== null) {
    const d = ((state.target - state.tod + 36) % 24) - 12;
    if (Math.abs(d) < 0.01) { state.tod = state.target; state.target = null; }
    else state.tod = (state.tod + d * Math.min(1, dt * 2.6) + 24) % 24;
  }
  if (Math.abs(state.tod - lastTod) > 1e-4) { applyTime(state.tod); lastTod = state.tod; syncUI(); }
  controls.update(dt);
  sky.position.copy(camera.position);
  const day = 1 - smooth(0.25, 0.75, nightF);
  if (state.petals) updatePetals(dt, elapsed);
  updateBirds(elapsed, day);
  updateKoi(elapsed);
  updateButterflies(elapsed, day);
  cloudGroup.rotation.y = elapsed * 0.004;
  for (const c of cloudGroup.children) c.position.y += Math.sin(elapsed * 0.2 + c.userData.bob) * 0.01;
  const ps = renderer.getPixelRatio() * innerHeight * 0.5;
  if (fireflies) fireflies.material.uniforms.uScale.value = ps * 1.5;
  if (smoke) smoke.material.uniforms.uScale.value = ps * 1.6;
  composer.render();
  if (!perfDone && elapsed > 1.5) {
    perfFrames++; perfTime += dt;
    if (perfFrames === 90) {
      const avg = perfTime / perfFrames;
      if (avg > 0.034 && pixelRatio > 1) { pixelRatio = 1; resize(); perfFrames = 0; perfTime = 0; }
      else if (avg > 0.045 && pixelRatio > 0.75) { pixelRatio = 0.75; resize(); perfDone = true; }
      else perfDone = true;
    }
  }
  requestAnimationFrame(frame);
}

// Small console API, e.g. garden.setTime(21.5) or garden.setView(180, 70, 40)
window.garden = {
  setTime: (t) => { state.tod = ((t % 24) + 24) % 24; state.target = null; setLapse(false); },
  setView: (r, phi, th) => { setOrbit(false); placeCamera(r, phi, th); controls.update(); },
  controls, stats: null,
};
await build();
applyTime(state.tod); lastTod = state.tod; syncUI();
window.__sceneReady = true;
requestAnimationFrame(frame);
$('loader').classList.add('done');
setTimeout(() => $('loader').remove(), 1400);
</script>
